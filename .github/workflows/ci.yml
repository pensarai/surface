name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run tsc

      - run: bun run format:check

      - run: node scripts/check-dependency-pins.mjs

      - run: node --test scripts/check-dependency-pins.test.mjs

      - run: bun run build

      - run: node scripts/smoke-test.mjs

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Audit workflows and local actions
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          # Pedantic reports an image pinned to a tag instead of a digest.
          persona: pedantic
          advanced-security: false
          annotations: true

  # Fails a PR that introduces a critical, high or malware advisory in the
  # lockfile. osv-scanner runs offline: the advisory database is downloaded
  # fresh, and the dependency list never leaves the runner. See
  # scripts/osv-gate.mjs.
  vulnerable-dependencies:
    name: vulnerable-dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The gate scans the lockfile at the merge base too.
          fetch-depth: 0
      - name: Test the gate
        run: node --test scripts/osv-gate.test.mjs
      # Pinned release, checked against the SHA-256 in its published
      # osv-scanner_SHA256SUMS before it runs.
      - name: Install osv-scanner
        env:
          OSV_SCANNER_VERSION: 2.7.1
          OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/osv-bin"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $bin/osv-scanner" | sha256sum -c -
          chmod +x "$bin/osv-scanner"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Gate new vulnerable dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY: ${{ runner.temp }}/osv-db
        run: node scripts/osv-gate.mjs --base "$BASE_SHA"
